name: Upload one Firebase Hosting site

on:
  workflow_call:
    inputs:
      target: { required: true, type: string }
      revision: { required: true, type: string }
    secrets:
      existing_deploy_key: { required: false }

permissions: {}

jobs:
  upload:
    if: >-
      github.repository == 'playzzin/cy' && github.ref == 'refs/heads/main' &&
      (inputs.target == 'staging' || inputs.target == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: ${{ inputs.target }}
    concurrency:
      group: firebase-hosting-${{ inputs.target }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ inputs.target == 'production' && 'cyee-9c1e4' || 'cy-erp-staging-9c1e4' }}
    steps:
      - name: Check deployment identity configuration
        env:
          PROVIDER: ${{ vars.CY_HOSTING_WIF_PROVIDER }}
          HAS_EXISTING_KEY: ${{ secrets.existing_deploy_key != '' }}
        run: |
          if [[ -z "$PROVIDER" && "$HAS_EXISTING_KEY" != true ]]; then
            echo "::error::Firebase Hosting 배포 인증이 설정되지 않았습니다. 해당 GitHub Environment의 CY_HOSTING_WIF_PROVIDER 또는 기존 프로젝트 전용 Firebase 배포 인증을 확인하세요."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --global firebase-tools@15.37.0
      - name: Prepare public production web configuration
        if: inputs.target == 'production'
        run: node scripts/ci-hosting-web-config.cjs
      - name: Authenticate to Firebase Hosting
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.CY_HOSTING_WIF_PROVIDER }}
          service_account: ${{ vars.CY_HOSTING_SERVICE_ACCOUNT }}
          credentials_json: ${{ !vars.CY_HOSTING_WIF_PROVIDER && secrets.existing_deploy_key || '' }}
      - name: Check access to the selected Hosting site
        run: firebase hosting:sites:get "$PROJECT_ID" --project "$PROJECT_ID" --non-interactive
      - name: Deploy and verify staging
        if: inputs.target == 'staging'
        env:
          CY_DEPLOY_MAIN_COMMIT: ${{ inputs.revision }}
        run: npm run staging:deploy
      - name: Deploy and verify production
        if: inputs.target == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run deploy:main -- --checked-in-github
      - name: Report Firebase CLI errors without credentials
        if: failure()
        run: node scripts/firebase-deploy-diagnostics.cjs
