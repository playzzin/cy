name: Hosting connectivity

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hosting-*.yml'
      - 'scripts/*hosting*.cjs'
      - 'scripts/check-release.cjs'
      - 'scripts/deploy-*.cjs'
      - 'scripts/published-main.cjs'
      - 'scripts/staging-environment.cjs'
      - 'firebase*.json'

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'playzzin/cy' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Read GitHub main and both live Hosting records
        env:
          NODE_USE_ENV_PROXY: '1'
        run: npm run deploy:check
