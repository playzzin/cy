name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - backup
      - main
      - master

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm --prefix functions ci

      - name: Verify project health
        run: npm run verify:project

      - name: Build hosting app
        run: npm run build

      - name: Verify hosting build
        run: npm run verify:hosting-build
