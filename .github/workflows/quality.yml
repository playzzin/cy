name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - backup
      - main
      - master

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm --prefix functions ci

      # Restore after npm ci, which removes node_modules (including its caches).
      # Cache compiler state only; successful-check proofs and release outputs
      # must be produced and verified by this run.
      - name: Restore compiler caches
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/cy-workspaces/*/production
            node_modules/.cache/cy-workspaces/*/typecheck.tsbuildinfo
          key: ${{ runner.os }}-node22-cy-build-v1-${{ hashFiles('package-lock.json', 'tsconfig.json', 'tailwind.config.js', 'postcss.config.js', 'scripts/build-performance.cjs', 'scripts/patchReactScriptsWebpack.js', 'scripts/postcss-readable-type.js') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node22-cy-build-v1-${{ hashFiles('package-lock.json', 'tsconfig.json', 'tailwind.config.js', 'postcss.config.js', 'scripts/build-performance.cjs', 'scripts/patchReactScriptsWebpack.js', 'scripts/postcss-readable-type.js') }}-

      - name: Verify project health
        run: npm run verify:project

      - name: Verify release comparison
        run: npm run test:release-tools

      - name: Verify every server unit test
        run: npm run test:functions

      - name: Lint hardened modules
        run: npm run lint:improvements

      # Quality-only build; production deployment uses the local production environment.
      - name: Build hosting app
        env:
          REACT_APP_FIREBASE_API_KEY: demo-ci-build-key
          REACT_APP_FIREBASE_AUTH_DOMAIN: demo-cy-quality.firebaseapp.com
          REACT_APP_FIREBASE_PROJECT_ID: demo-cy-quality
          REACT_APP_FIREBASE_STORAGE_BUCKET: demo-cy-quality.appspot.com
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: '1234567890'
          REACT_APP_FIREBASE_APP_ID: '1:1234567890:web:quality-build'
        run: npm run build

      - name: Verify hosting build
        run: npm run verify:hosting-build

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run functions:build
      - run: npm install --global firebase-tools@15.1.0
      - name: Verify memo access and reminder rules with fake data
        run: node scripts/run-smart-memo-rules-test.mjs
      - name: Verify task notifications and recipient access with fake data
        run: node scripts/run-task-notification-rules-test.mjs
      - name: Verify storage access with fake data
        run: node scripts/run-storage-manager-rules-test.mjs
