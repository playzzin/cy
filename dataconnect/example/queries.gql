# List Queries

query ListCompanies @auth(level: USER, insecureReason: "Operation is intended for use by authenticated app users; fine-grained authorization is handled at the application level.") {
  companies(limit: 5000) {
    id
    legacyId
    name
    code
    businessNumber
    ceoName
    type
    status
    createdAt
  }
}

