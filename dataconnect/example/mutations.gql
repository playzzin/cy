# Create Company
mutation CreateCompany($name: String!, $code: String!, $legacyId: String, $businessNumber: String, $ceoName: String, $type: String, $status: Status, $address: String, $phone: String, $email: String, $bankName: String, $accountNumber: String, $accountHolder: String, $ceoResidentNumber: String, $color: String) @auth(level: USER, insecureReason: "Operation is intended for use by authenticated app users; fine-grained authorization is handled at the application level.") {
  company_insert(data: {
    legacyId: $legacyId,
    name: $name,
    code: $code,
    businessNumber: $businessNumber,
    ceoName: $ceoName,
    type: $type,
    status: $status,
    address: $address,
    phone: $phone,
    email: $email,
    bankName: $bankName,
    accountNumber: $accountNumber,
    accountHolder: $accountHolder,
    ceoResidentNumber: $ceoResidentNumber,
    color: $color
  })
}

