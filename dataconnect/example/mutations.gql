    teamId: $teamId,
    siteId: $siteId,
    siteName: $siteName,
    status: $status,
    writerUid: $writerUid,
    companyName: $companyName,
    responsibleTeamName: $responsibleTeamName,
    responsibleTeamLegacyId: $responsibleTeamLegacyId,
    totalManDay: $totalManDay,
