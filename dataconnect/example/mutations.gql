# Create Daily Report Worker
mutation CreateDailyReportWorker($dailyReportId: UUID!, $workerId: UUID!, $gongsu: Float!, $unitPrice: Float!, $amount: Float!, $workDescription: String, $legacyWorkerId: String, $legacyTeamId: String, $workerName: String, $role: String, $status: String, $manDay: Float, $payType: String, $salaryModel: String, $workContent: String) @auth(level: USER, insecureReason: "Operation is intended for use by authenticated app users; fine-grained authorization is handled at the application level.") {
  dailyReportWorker_insert(data: {
    dailyReportId: $dailyReportId,
    workerId: $workerId,
    gongsu: $gongsu,
    unitPrice: $unitPrice,
    amount: $amount,
    workDescription: $workDescription,
    legacyWorkerId: $legacyWorkerId,
    legacyTeamId: $legacyTeamId,
    workerName: $workerName,
    role: $role,
    status: $status,
    manDay: $manDay,
    payType: $payType,
    salaryModel: $salaryModel,
    workContent: $workContent
  })
}

mutation UpdateDailyReportWorker($dailyReportId: UUID!, $workerId: UUID!, $gongsu: Float, $unitPrice: Float, $amount: Float, $workDescription: String, $legacyWorkerId: String, $legacyTeamId: String, $workerName: String, $role: String, $status: String, $manDay: Float, $payType: String, $salaryModel: String, $workContent: String) @auth(level: USER, insecureReason: "Operation is intended for use by authenticated app users; fine-grained authorization is handled at the application level.") {
  dailyReportWorker_update(key: { dailyReportId: $dailyReportId, workerId: $workerId }, data: {
    gongsu: $gongsu,
    unitPrice: $unitPrice,
    amount: $amount,
    workDescription: $workDescription,
    legacyWorkerId: $legacyWorkerId,
    legacyTeamId: $legacyTeamId,
    workerName: $workerName,
    role: $role,
    status: $status,
    manDay: $manDay,
    payType: $payType,
    salaryModel: $salaryModel,
    workContent: $workContent
  })
}

mutation DeleteDailyReportWorker($dailyReportId: UUID!, $workerId: UUID!) @auth(level: USER, insecureReason: "Operation is intended for use by authenticated app users; fine-grained authorization is handled at the application level.") {
  dailyReportWorker_delete(key: { dailyReportId: $dailyReportId, workerId: $workerId })
}

