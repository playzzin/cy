# 0. Enums
enum Status { ACTIVE, INACTIVE, ARCHIVED }

# 1. Company
type Company @table {
    id: UUID! @default(expr: "uuidV4()")
    legacyId: String # Original Firestore ID
    name: String!
    code: String!
    businessNumber: String
    ceoName: String
    type: String
    status: Status! @default(value: ACTIVE)
    siteName: String
    siteManager: String
    address: String
    phone: String
    email: String
    bankName: String
    accountNumber: String
    accountHolder: String
    ceoResidentNumber: String
    color: String
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

# 2. Team
type Team @table {
    id: UUID! @default(expr: "uuidV4()")
    legacyId: String # Original Firestore ID
    name: String!
    company: Company
    leader: Worker
    type: String
    status: Status! @default(value: ACTIVE)
    totalManDay: Float
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

# 3. Worker
type Worker @table {
    id: UUID! @default(expr: "uuidV4()")
    legacyId: String # Original Firestore ID
    name: String!
    team: Team
    role: String
    payType: String # '일급', '월급'
    unitPrice: Float
    residentNumber: String
    phone: String
    address: String
    bankAccount: String
    bankName: String
    isActive: Boolean @default(value: true)
    joinDate: Date
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

# 4. Site
type Site @table {
    id: UUID! @default(expr: "uuidV4()")
    legacyId: String # Original Firestore ID
    name: String!
    code: String
    address: String
    startDate: Date
    endDate: Date
    status: Status! @default(value: ACTIVE)
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

# 5. Position (Role) - For Data Integrity
type Position @table {
    id: UUID! @default(expr: "uuidV4()")
    legacyId: String # Original Firestore ID
    name: String!
    rank: Int
    color: String
    icon: String
    isDefault: Boolean @default(value: false)
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

# 6. Daily Report (Header)
type DailyReport @table {
    id: UUID! @default(expr: "uuidV4()")
    legacyId: String # Original Firestore ID
    date: Date!
    team: Team!
    site: Site
    siteName: String # Denormalized for convenience
    status: String # 'draft', 'submitted', 'approved'
    writerUid: String
    companyName: String
    responsibleTeamName: String
    responsibleTeamLegacyId: String
    weather: String
    totalManDay: Float
    totalAmount: Float
    workContent: String
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

# 7. Daily Report Worker (Detail)
type DailyReportWorker @table(key: ["dailyReport", "worker"]) {
    id: UUID! @default(expr: "uuidV4()")
    dailyReport: DailyReport!
    worker: Worker!
    gongsu: Float!
    unitPrice: Float!
    amount: Float!
    workDescription: String
    legacyWorkerId: String
    legacyTeamId: String
    workerName: String
    role: String
    status: String
    manDay: Float
    payType: String
    salaryModel: String
    workContent: String
    createdAt: Timestamp! @default(expr: "request.time")
}

type AppUser @table {
    id: String!
    uid: String
    email: String
    displayName: String
    photoUrl: String
    linkedWorkerIds: String
    role: String
    lastLogin: Timestamp
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

# 8. Menu Configuration (JSONB)
type MenuConfig @table {
    id: String! # e.g. "default", "sidebar"
    config: String! # Store as stringified JSON for now
    updatedAt: Timestamp! @default(expr: "request.time")
}

# 9. System Log
type SystemLog @table {
    id: UUID! @default(expr: "uuidV4()")
    category: String!
    action: String!
    userEmail: String
    details: String
    createdAt: Timestamp! @default(expr: "request.time")
}

type AuditLog @table {
    id: String!
    action: String
    category: String
    actorId: String
    actorEmail: String
    targetId: String
    details: String
    timestamp: Timestamp
    createdAt: Timestamp! @default(expr: "request.time")
}

type Agent @table {
    id: String!
    name: String
    type: String
    role: String
    capabilities: String
    systemPrompt: String
    status: String
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

type AgentConversation @table {
    id: String!
    mainAgentId: String
    userId: String
    messages: String
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

type Setting @table {
    id: String!
    data: String!
    updatedAt: Timestamp! @default(expr: "request.time")
}

type SystemConfig @table {
    id: String!
    data: String!
    updatedAt: Timestamp! @default(expr: "request.time")
}

# 10. Accommodation (V2 Consolidation)
type Accommodation @table {
    id: UUID! @default(expr: "uuidV4()")
    legacyId: String # Link to v2 ID
    name: String!
    address: String!
    type: String! # OneRoom, TwoRoom, Apartment
    status: String! # active, inactive
    ownership: String! # Cheongyeon, Dawon, Individual
    
    # Cost Profile
    electricityMode: String!
    gasMode: String!
    waterMode: String!
    internetMode: String!
    maintenanceMode: String!
    
    fixedElectricity: Int
    fixedGas: Int
    fixedWater: Int
    fixedInternet: Int
    fixedMaintenance: Int

    # Contract specific
    contractStartDate: String
    contractEndDate: String
    deposit: Int!
    monthlyRent: Int!
    paymentDay: Int!
    landlordName: String
    landlordContact: String
    isReported: Boolean!
    
    # Financial details
    bankName: String
    accountNumber: String
    accountHolder: String
    rentPayDate: Int
    isAutoTransfer: Boolean
    transferDay: Int
    transferAccountInfo: String

    # Billing Target
    billingTargetType: String # team, worker
    billingTargetTeamId: String
    billingTargetTeamName: String
    billingTargetWorkerId: String
    billingTargetWorkerName: String

    # Quick summary references
    currentOccupantName: String
    currentOccupantPhone: String
    memo: String
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

# 11. Accommodation Assignment (V2)
type AccommodationAssignment @table {
    id: UUID! @default(expr: "uuidV4()")
    legacyId: String 
    accommodation: Accommodation!
    teamId: UUID
    teamName: String
    workerId: UUID
    workerName: String
    startDate: String!
    endDate: String
    status: String! # active, ended
    source: String
    memo: String
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

# 12. Utility Record (V2)
type UtilityRecord @table(key: ["accommodation", "yearMonth"]) {
    id: UUID! @default(expr: "uuidV4()")
    legacyId: String # Original Firestore ID
    accommodation: Accommodation!
    yearMonth: String! # YYYY-MM
    accommodationName: String
    costs: String # JSON string for UtilityCosts
    paymentDate: String
    paymentStatus: String! # paid, pending, unpaid
    memo: String
    isAnomaly: Boolean
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

# 13. Accommodation Billing Document (V2)
type AccommodationBillingDocument @table {
    id: UUID! @default(expr: "uuidV4()")
    yearMonth: String!
    team: Team
    teamName: String
    issuedToType: String! # team_leader, worker
    issuedToWorker: Worker
    issuedToWorkerName: String
    status: String! @default(value: "draft") # draft, confirmed
    memo: String
    confirmedAt: Timestamp
    postedAdvancePaymentId: String
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

# 14. Accommodation Billing Line Item (V2)
type AccommodationBillingLineItem @table {
    id: UUID! @default(expr: "uuidV4()")
    billingDocument: AccommodationBillingDocument!
    label: String!
    amount: Int!
    targetField: String!
    createdAt: Timestamp! @default(expr: "request.time")
}

# 15. Advance Payment (V2)
type AdvancePayment @table {
    id: String! # teamId_workerId_yearMonth
    worker: Worker
    workerName: String
    team: Team
    teamName: String
    yearMonth: String! # YYYY-MM
    items: String # JSON string for Record<string, number>
    prevMonthCarryover: Int @default(value: 0)
    accommodation: Int @default(value: 0)
    privateRoom: Int @default(value: 0)
    gloves: Int @default(value: 0)
    deposit: Int @default(value: 0)
    fines: Int @default(value: 0)
    electricity: Int @default(value: 0)
    gas: Int @default(value: 0)
    internet: Int @default(value: 0)
    water: Int @default(value: 0)
    totalDeduction: Int @default(value: 0)
    memo: String
    updatedAt: Timestamp! @default(expr: "request.time")
}

# 16. Smart Memo Category
type SmartMemoCategory @table {
    id: UUID! @default(expr: "uuidV4()")
    legacyId: String
    userId: String!
    name: String!
    color: String
    icon: String
    order: Int @default(value: 0)
    createdAt: Timestamp! @default(expr: "request.time")
}

# 17. Smart Memo
type SmartMemo @table {
    id: UUID! @default(expr: "uuidV4()")
    legacyId: String
    userId: String!
    scope: String! @default(value: "private") # private, public
    type: String! @default(value: "text") # text, checklist
    title: String
    content: String
    checklistItems: String # JSON string
    color: String
    order: Int @default(value: 0)
    isPinned: Boolean @default(value: false)
    tags: String # JSON string
    category: SmartMemoCategory
    categoryLegacyId: String
    priority: String
    x: Int
    y: Int
    w: Int
    h: Int
    isCollapsed: Boolean @default(value: false)
    prevW: Int
    prevH: Int
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

