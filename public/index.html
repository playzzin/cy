<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e7490" />
    <meta name="description" content="청연ENG ERP 현장 관리 시스템" />
    <meta name="application-name" content="청연ENG ERP" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CY ERP" />
    <meta name="msapplication-TileColor" content="#07111f" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/icons/icon-192.png" />
    <title>청연ENG ERP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Pen+Script&family=Dancing+Script:wght@400;700&family=Hi+Melody&family=Gowun+Dodum&family=Reenie+Beanie&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        html,
        body,
        #root {
            min-height: 100%;
        }

        body {
            margin: 0;
            font-family: 'Pretendard', sans-serif;
            background: #07111f;
        }

        .app-intro {
            position: relative;
            display: grid;
            min-height: 100vh;
            place-items: center;
            overflow: hidden;
            color: #e5f8ff;
            background:
                linear-gradient(120deg, rgba(34, 211, 238, 0.16), transparent 36%, rgba(251, 191, 36, 0.1) 76%, transparent),
                linear-gradient(145deg, #05111f 0%, #083344 48%, #0f172a 100%);
        }

        .app-intro::before {
            position: absolute;
            inset: 0;
            content: "";
            background-image:
                linear-gradient(rgba(125, 211, 252, 0.13) 1px, transparent 1px),
                linear-gradient(90deg, rgba(125, 211, 252, 0.13) 1px, transparent 1px),
                linear-gradient(135deg, transparent 46%, rgba(34, 211, 238, 0.14) 47%, rgba(34, 211, 238, 0.14) 48%, transparent 49%);
            background-size: 64px 64px, 64px 64px, 320px 320px;
            opacity: 0.38;
            -webkit-mask-image: radial-gradient(circle at center, #000 0%, transparent 76%);
            mask-image: radial-gradient(circle at center, #000 0%, transparent 76%);
        }

        .app-intro::after {
            position: absolute;
            right: -6rem;
            bottom: 6rem;
            width: 34rem;
            height: 1px;
            content: "";
            background: linear-gradient(90deg, transparent, rgba(34, 211, 238, 0.32), rgba(251, 191, 36, 0.26), transparent);
            transform: rotate(-18deg);
        }

        .app-intro__content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: min(100%, 25rem);
            padding: 2rem;
            text-align: center;
        }

        .app-intro__mark-shell {
            display: grid;
            width: 7rem;
            height: 7rem;
            place-items: center;
            border: 1px solid rgba(165, 243, 252, 0.26);
            border-radius: 2rem;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03));
            box-shadow: 0 2rem 4rem rgba(0, 0, 0, 0.35), 0 0 0 0.5rem rgba(14, 116, 144, 0.1);
            animation: app-intro-float 3.6s ease-in-out infinite;
        }

        .app-intro__mark {
            width: 6.25rem;
            height: 6.25rem;
            border-radius: 1.75rem;
        }

        .app-intro__eyebrow {
            margin-top: 1.5rem;
            color: #67e8f9;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0;
        }

        .app-intro__title {
            margin: 0.45rem 0 0;
            color: #f8fafc;
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.12;
            letter-spacing: 0;
            text-shadow: 0 1rem 2rem rgba(0, 0, 0, 0.28);
        }

        .app-intro__message {
            margin-top: 0.8rem;
            color: rgba(226, 232, 240, 0.82);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .app-intro__progress {
            position: relative;
            width: 11.5rem;
            height: 0.2rem;
            margin-top: 1.55rem;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.2);
        }

        .app-intro__progress::before {
            position: absolute;
            inset: 0;
            content: "";
            border-radius: inherit;
            background: linear-gradient(90deg, transparent, #22d3ee 34%, #fbbf24 70%, transparent);
            transform: translateX(-100%);
            animation: app-intro-progress 1.35s ease-in-out infinite;
        }

        @keyframes app-intro-progress {
            100% {
                transform: translateX(100%);
            }
        }

        @keyframes app-intro-float {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-0.35rem);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .app-intro__mark-shell,
            .app-intro__progress::before {
                animation: none;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
        <div class="app-intro" role="status" aria-live="polite" aria-label="청연ENG ERP 로딩 중">
            <div class="app-intro__content">
                <div class="app-intro__mark-shell" aria-hidden="true">
                    <img class="app-intro__mark" src="%PUBLIC_URL%/icons/icon-192.png" alt="" />
                </div>
                <div class="app-intro__eyebrow">CHUNG YEON ENG</div>
                <h1 class="app-intro__title">청연ENG ERP</h1>
                <div class="app-intro__message">현장 관리 시스템 준비 중</div>
                <div class="app-intro__progress" aria-hidden="true"></div>
            </div>
        </div>
    </div>
</body>

</html>
