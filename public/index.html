<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e7490" />
    <meta name="description" content="청연ENG ERP 현장 관리 시스템" />
    <meta name="application-name" content="청연ENG ERP" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CY ERP" />
    <meta name="msapplication-TileColor" content="#07111f" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json?v=20260524" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/icons/icon-192.png?v=20260524" />
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/icons/icon-192.png?v=20260524" />
    <title>청연ENG ERP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Pen+Script&family=Dancing+Script:wght@400;700&family=Hi+Melody&family=Gowun+Dodum&family=Reenie+Beanie&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        html,
        body,
        #root {
            min-height: 100%;
        }

        body {
            margin: 0;
            font-family: 'Pretendard', sans-serif;
            background: #07111f;
        }

        .app-intro {
            position: relative;
            isolation: isolate;
            display: grid;
            min-height: 100vh;
            place-items: center;
            overflow: hidden;
            color: #e5f8ff;
            background:
                linear-gradient(180deg, #061225 0%, #020817 58%, #01040b 100%);
            animation: app-intro-screen-in 0.35s ease-out both;
        }

        .app-intro::before {
            position: absolute;
            inset: 0;
            content: "";
            background-image:
                linear-gradient(rgba(125, 211, 252, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(125, 211, 252, 0.08) 1px, transparent 1px);
            background-size: 56px 56px;
            opacity: 0.42;
            transform: translate3d(0, 0, 0);
            animation: app-intro-grid 7s linear infinite;
        }

        .app-intro::after {
            position: absolute;
            inset: 0;
            content: "";
            background:
                linear-gradient(115deg, transparent 0%, transparent 42%, rgba(56, 189, 248, 0.16) 49%, transparent 56%, transparent 100%);
            transform: translateX(-38%);
            animation: app-intro-scan 2.8s ease-in-out infinite;
        }

        .app-intro__content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: min(100%, 25rem);
            padding: 2rem;
            text-align: center;
        }

        .app-intro__mark-shell {
            position: relative;
            display: grid;
            width: 9.5rem;
            height: 9.5rem;
            place-items: center;
            animation:
                app-intro-logo-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both,
                app-intro-float 3.3s ease-in-out 0.7s infinite;
        }

        .app-intro__mark-shell::before {
            position: absolute;
            inset: -0.55rem;
            z-index: -1;
            content: "";
            border-radius: 2.65rem;
            background: conic-gradient(from 140deg, transparent 0deg, rgba(56, 189, 248, 0.15) 64deg, rgba(14, 165, 233, 0.55) 108deg, rgba(255, 255, 255, 0.42) 140deg, transparent 190deg, transparent 360deg);
            filter: blur(0.2px);
            opacity: 0.85;
            animation: app-intro-ring 2.6s linear infinite;
        }

        .app-intro__mark-shell::after {
            position: absolute;
            inset: 0.38rem;
            z-index: 2;
            content: "";
            border-radius: 2.15rem;
            background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.38) 45%, transparent 58%);
            mix-blend-mode: screen;
            opacity: 0;
            transform: translateX(-120%);
            animation: app-intro-logo-sheen 2.4s ease-in-out 0.45s infinite;
        }

        .app-intro__mark {
            position: relative;
            z-index: 1;
            width: 8.75rem;
            height: 8.75rem;
            border: 1px solid rgba(226, 232, 240, 0.16);
            border-radius: 2rem;
            object-fit: cover;
            box-shadow: 0 2rem 4.5rem rgba(0, 0, 0, 0.42), 0 0 2rem rgba(56, 189, 248, 0.2);
            animation: app-intro-logo-glow 2.4s ease-in-out infinite;
        }

        .app-intro__eyebrow {
            margin-top: 1.65rem;
            color: #67e8f9;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0;
        }

        .app-intro__title {
            margin: 0.45rem 0 0;
            color: #f8fafc;
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.12;
            letter-spacing: 0;
            text-shadow: 0 1rem 2rem rgba(0, 0, 0, 0.28);
        }

        .app-intro__message {
            margin-top: 0.8rem;
            color: rgba(226, 232, 240, 0.82);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .app-intro__progress {
            position: relative;
            width: 12.5rem;
            height: 0.24rem;
            margin-top: 1.55rem;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.18);
            box-shadow: inset 0 0 0 1px rgba(226, 232, 240, 0.06);
        }

        .app-intro__progress::before {
            position: absolute;
            inset: 0;
            content: "";
            border-radius: inherit;
            background: linear-gradient(90deg, transparent, #38bdf8 34%, #0ea5e9 70%, transparent);
            transform: translateX(-100%);
            animation: app-intro-progress 1.35s ease-in-out infinite;
        }

        @keyframes app-intro-screen-in {
            from {
                opacity: 0.92;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes app-intro-grid {
            100% {
                background-position: 56px 56px, 56px 56px;
            }
        }

        @keyframes app-intro-scan {
            0%,
            18% {
                opacity: 0;
                transform: translateX(-38%);
            }

            46% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: translateX(38%);
            }
        }

        @keyframes app-intro-ring {
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes app-intro-progress {
            100% {
                transform: translateX(100%);
            }
        }

        @keyframes app-intro-logo-rise {
            from {
                opacity: 0.74;
                transform: translateY(0.35rem) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes app-intro-float {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-0.35rem);
            }
        }

        @keyframes app-intro-logo-glow {
            0%,
            100% {
                filter: saturate(1) brightness(1);
            }

            50% {
                filter: saturate(1.08) brightness(1.08);
            }
        }

        @keyframes app-intro-logo-sheen {
            0%,
            35% {
                opacity: 0;
                transform: translateX(-120%);
            }

            52% {
                opacity: 0.65;
            }

            72%,
            100% {
                opacity: 0;
                transform: translateX(120%);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .app-intro__mark-shell,
            .app-intro__mark-shell::before,
            .app-intro__mark-shell::after,
            .app-intro__mark,
            .app-intro::before,
            .app-intro::after,
            .app-intro__progress::before {
                animation: none;
            }

            .app-intro::after {
                opacity: 0;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
        <div class="app-intro" role="status" aria-live="polite" aria-label="청연ENG ERP 로딩 중">
            <div class="app-intro__content">
                <div class="app-intro__mark-shell" aria-hidden="true">
                    <img class="app-intro__mark" src="%PUBLIC_URL%/icons/icon-512.png?v=20260524" alt="" width="140" height="140" />
                </div>
                <div class="app-intro__eyebrow">CHUNG YEON ENG</div>
                <h1 class="app-intro__title">청연ENG ERP</h1>
                <div class="app-intro__message">현장 관리 시스템 준비 중</div>
                <div class="app-intro__progress" aria-hidden="true"></div>
            </div>
        </div>
    </div>
</body>

</html>
